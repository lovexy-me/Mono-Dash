name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      patch_url:
        description: 'Patch URL (optional)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        if: ${{ github.event.inputs.patch_url != '' }}
        run: |
          curl -fsSL "${{ github.event.inputs.patch_url }}" -o /tmp/change.patch
          git config user.name "lovexy-me"
          git config user.email "lovexy-me@users.noreply.github.com"
          git am /tmp/change.patch
          git push origin HEAD:main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 1Panel Dash build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
